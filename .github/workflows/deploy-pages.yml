name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Refresh registries"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    permissions:
      contents: read
      pages: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download snapshots from successful refresh
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: registry-snapshots
          path: generated
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Restore last-known-good snapshots for code deployments
        if: github.event_name != 'workflow_run'
        uses: actions/cache/restore@v4
        with:
          path: |
            generated/lmstudio-discovery.json
            generated/lmstudio-enriched.json
            generated/mcp-registry.json
          key: registries-v1-deploy-${{ github.run_id }}
          restore-keys: registries-v1-
          fail-on-cache-miss: true

      - name: Validate complete nonempty snapshots
        run: pnpm validate:registries

      - name: Build marketplace from validated snapshots
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sahansera.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/local-ai-tools' }}
        run: pnpm build

      - name: Verify full marketplace routes
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/local-ai-tools' }}
        run: pnpm verify:web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
