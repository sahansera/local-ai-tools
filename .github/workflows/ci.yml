name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate catalogue
        run: pnpm validate:catalog

      - name: Generate catalogue
        run: pnpm generate:catalog

      - name: Verify app icon
        run: node -e "const fs=require('node:fs'); const bytes=fs.readFileSync('apps/web/public/app-icon.png'); const png=Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]); if (!bytes.subarray(0,8).equals(png)) throw new Error('apps/web/public/app-icon.png is not a valid PNG');"

      - name: Format check
        run: |
          pnpm exec prettier README.md --write
          git diff -- README.md
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          SITE_URL: https://sahansera.github.io
          SITE_BASE: /local-ai-tools
        run: pnpm build

      - name: Verify GitHub Pages routes
        run: |
          grep -q 'href="/local-ai-tools/tools/' apps/web/dist/index.html
          ! grep -q '/local-ai-toolstools/' apps/web/dist/index.html
          cmp apps/web/public/app-icon.png apps/web/dist/app-icon.png
