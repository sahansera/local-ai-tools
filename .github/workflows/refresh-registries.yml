name: Refresh registries

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - name: Restore last validated snapshots
        uses: actions/cache/restore@v4
        with:
          path: |
            generated/lmstudio-discovery.json
            generated/lmstudio-enriched.json
            generated/mcp-registry.json
          key: registries-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: registries-v1-
      - name: Refresh atomically or retain valid snapshots
        id: refresh
        run: pnpm refresh:registries
      - run: pnpm validate:registries
      - run: pnpm validate:catalog
      - name: Build and verify full marketplace
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sahansera.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/local-ai-tools' }}
        run: |
          pnpm build
          pnpm verify:web
      - name: Save last-known-good snapshots after build verification
        if: steps.refresh.outputs.status == 'fresh'
        uses: actions/cache/save@v4
        with:
          path: |
            generated/lmstudio-discovery.json
            generated/lmstudio-enriched.json
            generated/mcp-registry.json
          key: registries-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish validated snapshots for this run
        uses: actions/upload-artifact@v4
        with:
          name: registry-snapshots
          retention-days: 30
          if-no-files-found: error
          path: |
            generated/lmstudio-discovery.json
            generated/lmstudio-enriched.json
            generated/mcp-registry.json
