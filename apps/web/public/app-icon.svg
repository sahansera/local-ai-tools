<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Local AI Tools</title>
  <desc id="desc">A friendly AI assistant in front of a tool panel on a blue and purple app tile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a4dff"/>
      <stop offset="0.48" stop-color="#4c3ff1"/>
      <stop offset="1" stop-color="#1686ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#b36cff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#b36cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.83" cy="0.82" r="0.75">
      <stop offset="0" stop-color="#0b8eff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#0b8eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6336de"/>
      <stop offset="0.55" stop-color="#2f2d98"/>
      <stop offset="1" stop-color="#182767"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5b8ff"/>
      <stop offset="1" stop-color="#6174ef"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9b3ff"/>
      <stop offset="1" stop-color="#8058ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#101551" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#glow1)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#glow2)"/>

  <g transform="rotate(6 332 244)" filter="url(#shadow)">
    <rect x="222" y="118" width="225" height="250" rx="50" fill="url(#panel)" stroke="#8a6cff" stroke-opacity=".55"/>
    <rect x="275" y="154" width="108" height="18" rx="9" fill="url(#line)"/>
    <rect x="323" y="197" width="98" height="18" rx="9" fill="url(#line)"/>
    <rect x="338" y="237" width="91" height="18" rx="9" fill="url(#line)"/>
    <rect x="318" y="278" width="88" height="18" rx="9" fill="url(#line)"/>
    <rect x="342" y="318" width="78" height="18" rx="9" fill="url(#line)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="229" width="74" height="96" rx="34" fill="url(#ear)"/>
    <rect x="330" y="229" width="74" height="96" rx="34" fill="url(#ear)"/>
    <rect x="103" y="178" width="257" height="206" rx="72" fill="url(#face)" stroke="#ffffff" stroke-opacity=".45"/>
    <path d="M154 275c8-28 38-28 46 0" fill="none" stroke="#31156f" stroke-width="16" stroke-linecap="round"/>
    <path d="M267 275c8-28 38-28 46 0" fill="none" stroke="#31156f" stroke-width="16" stroke-linecap="round"/>
    <path d="M219 307c17 18 40 18 57 0" fill="none" stroke="#31156f" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
